name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  ci:
    name: Syntax & import check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Verificar que todos los modulos importan correctamente
        run: |
          python -c "
          import main
          import app.core.config
          import app.api.webhook
          import app.workers.whatsapp
          import app.db.connection
          import app.db.repos.tenants
          import app.db.repos.conversations
          import app.db.repos.messages
          print('OK: todos los modulos importados')
          "
        env:
          WHATSAPP_VERIFY_TOKEN: ci_token
          WHATSAPP_APP_SECRET: ci_secret
          REDIS_URL: redis://localhost:6379
          DATABASE_URL: postgresql://localhost/brain_omni
